name: track_and_play
description: "Track & Play - Partien, Spieler und Decks erfassen und auswerten."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.3

  # Lokale Datenbank
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  path_provider: ^2.1.5

  # Datei-Export/-Import
  file_picker: ^10.3.7
  share_plus: ^12.0.1
  archive: ^4.0.7

  # QR-Code-Austausch (schnelles Teilen einzelner Spieler/Decks ohne Datei)
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

  # JSON (de)serialisierung fuer Export-/Import-Bundles laeuft ueber
  # dart:convert (jsonEncode/jsonDecode) + die von Drift generierten
  # toJson()/fromJson()-Methoden - kein Zusatzpaket noetig.

  # UI / Darstellung
  cupertino_icons: ^1.0.8
  fl_chart: ^1.1.1
  mana_icons_flutter: ^1.18.0
  animated_toggle_switch: ^0.8.7
  intl: ^0.19.0
  url_launcher: ^6.1.8
  # "Vault & Foil"-Theme (Cinzel/Manrope/IBM Plex Mono), siehe
  # lib/core/theme/app_theme.dart und ARCHITECTURE.md "Bekannte Fixes".
  google_fonts: ^6.2.1

  # Einfache Key-Value-Einstellungen (Solo-/Gruppen-Modus, aktiver "Ich"-Spieler)
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.29.0
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7

# Konfiguration fuer `dart run flutter_native_splash:create` - 1:1 von
# mtg_stats_tracker uebernommen (gleiches Icon, schwarzer Hintergrund),
# siehe ARCHITECTURE.md "Bekannte Fixes". Die generierten Ausgabedateien
# sind bereits eingecheckt (Android drawable-*/values-*) - dieser Block
# ist nur relevant, falls der Generator spaeter erneut laufen soll (z. B.
# nach einem Icon-Wechsel). iOS bewusst ausgenommen (wie im Vorgaenger-
# projekt) - dort bleibt der Flutter-Standard-Splash.
flutter_native_splash:
  color: "#0B1E26"
  image: assets/icon/tap_icon_fg.png
  android: true
  ios: false
  android_12:
    color: "#0B1E26"
    image: assets/icon/tap_icon_fg.png

flutter:
  uses-material-design: true

